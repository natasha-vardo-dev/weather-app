name: Providers

# The real Open-Meteo and MeteoAlarm, once a day, through the server's own adapters
# (server/scripts/checkProviders.ts): the tests run on recorded answers, so a change of format
# would otherwise be found by users. A failed scheduled run emails whoever last changed this
# schedule (GitHub's default); docs/operations.md says what to do.
on:
  schedule:
    - cron: '30 5 * * *'
  # By hand, from the Actions tab, e.g. after a provider announced a change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run providers:check -w server
