name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no change at all: advisories are published whatever we commit, so the
  # production audit must run anyway, and so must the tests (one depended on the date and
  # started failing a day after it was written). Runs on the default branch.
  schedule:
    - cron: '0 6 * * 1'
  # By hand, from the Actions tab.
  workflow_dispatch:

# Least privilege: the jobs only read the repository. A job that needs more asks for it itself.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code, a commit can't.
# The comment names the version; Dependabot (github-actions) updates both.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git/config for later steps (npm scripts, tests) to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Known high or critical vulnerabilities in what reaches users (the app and the API) fail
      # the build. Development and build tools are left out: their reports are mostly about
      # input we control, and npm's suggested fix for them is a downgrade by years.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      # docs/openapi.json is generated from the schemas in @weather/shared: a schema changed
      # without regenerating it fails here, so the comparison below sees the real contract.
      - run: npm run openapi:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Breaking changes to the API within its version: what clients already in use (an open tab on
  # old code, an answer in a cache, a future mobile app) rely on must not change under them.
  # Compares the pull request's OpenAPI description with the target branch's. A breaking
  # change belongs in a new version (API_PREFIX in @weather/shared); then the versions differ
  # and the comparison is skipped. See docs/architecture.md, "API versions".
  api-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Keeps its token: the next step fetches the target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: base
        name: The target branch's description
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          # In the workspace: the oasdiff action runs in a container that sees only the workspace
          # (not RUNNER_TEMP), at the same relative paths.
          if ! git show FETCH_HEAD:docs/openapi.json > openapi-base.json 2>/dev/null; then
            echo "::notice::No docs/openapi.json on ${{ github.base_ref }} yet: nothing to compare with."
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version() { node -p "require('$1').info.version"; }
          base=$(version "$GITHUB_WORKSPACE/openapi-base.json")
          head=$(version "$GITHUB_WORKSPACE/docs/openapi.json")
          if [ "$base" != "$head" ]; then
            echo "::notice::API version $base → $head: a new version may break the old one."
            echo "compare=false" >> "$GITHUB_OUTPUT"
          else
            echo "compare=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.compare == 'true'
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: openapi-base.json
          revision: docs/openapi.json
          fail-on: ERR
          # Nothing leaves CI: no upload to oasdiff.com for a side-by-side review, no PR comment.
          review: false
          github-token: ''

  # The interface in a real browser (Chromium, desktop and phone sizes), with the API mocked
  # and an axe accessibility check in each state. A job of its own: it needs a browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git/config for later steps (npm scripts, tests) to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
